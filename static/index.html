<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pens Wallboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --gold: #FCB514;
    --ice: #EEF2F4;
    --steel: #7E8B95;
    --rink: #161A1E;
    --tile: rgba(28, 33, 38, .88);
    --lamp: #E4002B;
    --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "Barlow", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--black); color: var(--ice); overflow: hidden; cursor: none; }
  body { font-family: var(--body); font-size: 1.6vh; }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: flex; }
  img { object-fit: contain; }
  .num { font-family: var(--display); font-variant-numeric: tabular-nums; }
  i.tc { display: block; width: .6vh; align-self: stretch; border-radius: .3vh; flex: none; }

  .rink { position: absolute; inset: 0; pointer-events: none; opacity: .09; }
  .rink svg { width: 100%; height: 100%; }
  .corner-clock { position: absolute; top: 3vh; right: 3vw; font-family: var(--display); font-size: 3.6vh; font-weight: 600; color: var(--steel); font-variant-numeric: tabular-nums; }
  .live-dot { width: 2.2vh; height: 2.2vh; border-radius: 50%; background: var(--lamp); align-self: center; animation: pulse 2s ease-in-out infinite; flex: none; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---------- live / pregame scoreboard ---------- */
  #board { flex-direction: column; align-items: center; justify-content: center; padding: 4vh 4vw 3vh; }
  .matchup { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; gap: 3vw; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 1.2vh; }
  .side img { width: 18vh; height: 18vh; }
  .side .tname { font-family: var(--display); font-weight: 700; font-size: 5.6vh; letter-spacing: .02em; }
  .side.us .tname { color: var(--gold); }
  .side .sog { font-family: var(--display); font-size: 3.2vh; color: var(--steel); }
  .side .sog b { color: var(--ice); font-weight: 600; }
  .scores { display: flex; align-items: center; gap: 2vw; }
  .big { font-family: var(--display); font-weight: 800; font-size: 29vh; line-height: .85; font-variant-numeric: tabular-nums; min-width: 1ch; text-align: center; }
  .big.us { color: var(--gold); }
  .dash { width: 2.4vw; height: 1.4vh; background: var(--steel); }
  .clockline { position: relative; margin-top: 3vh; display: flex; align-items: baseline; gap: 2.5vw; font-family: var(--display); }
  .clockline .period { font-size: 4.6vh; font-weight: 600; color: var(--steel); }
  .clockline .clock { font-size: 8vh; font-weight: 700; font-variant-numeric: tabular-nums; }
  .situ { position: relative; margin-top: 2vh; min-height: 6.4vh; font-family: var(--display); font-size: 4vh; font-weight: 700; }
  .situ span { display: inline-block; padding: .5vh 2.4vw; background: var(--gold); color: var(--black); }
  .situ span.them { background: var(--ice); }
  .boardfoot { position: relative; margin-top: 4vh; width: 100%; display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 3vw; min-height: 17vh; align-items: end; }
  .pbox { display: flex; flex-direction: column; gap: 1vh; }
  .pbox.home { align-items: flex-end; }
  .pen { display: flex; align-items: center; gap: 1.2vw; background: var(--tile); border-radius: .6vh; padding: 1vh 1.4vw; font-family: var(--display); }
  .pen .who { font-size: 3.4vh; font-weight: 700; }
  .pen .why { font-family: var(--body); font-size: 1.9vh; color: var(--steel); }
  .pen .left { font-size: 4vh; font-weight: 800; color: var(--lamp); font-variant-numeric: tabular-nums; }
  .pen-lbl { font-size: 1.8vh; color: var(--steel); }
  .recent { display: flex; flex-direction: column; gap: .8vh; }
  .recent .lbl { font-size: 1.8vh; color: var(--steel); text-align: center; }
  .gl { display: flex; align-items: center; gap: 1vw; font-family: var(--display); font-size: 3vh; font-weight: 600; }
  .gl .t { color: var(--steel); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 9ch; }
  .gl .tag { font-size: 2vh; padding: .1vh .6vw; border: 1px solid var(--steel); border-radius: .4vh; color: var(--steel); }
  .gl .sc { margin-left: auto; font-variant-numeric: tabular-nums; }

  /* ---------- intermission / final summary ---------- */
  #summary { flex-direction: column; padding: 4vh 4vw 3vh; gap: 3vh; }
  .sumhead { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2vw; }
  .sumhead .team { display: flex; align-items: center; gap: 1.5vw; font-family: var(--display); font-size: 5.2vh; font-weight: 700; }
  .sumhead .team.home { justify-content: flex-end; }
  .sumhead .team.us { color: var(--gold); }
  .sumhead .team img { width: 11vh; height: 11vh; }
  .sumhead .mid { display: flex; flex-direction: column; align-items: center; }
  .sumhead .sc { font-family: var(--display); font-weight: 800; font-size: 13vh; line-height: .9; display: flex; gap: 2vw; align-items: center; font-variant-numeric: tabular-nums; }
  .sumhead .sc .us { color: var(--gold); }
  .sumhead .sc .dash { width: 1.6vw; height: 1vh; }
  .sumhead .status { font-family: var(--display); font-size: 3.6vh; font-weight: 600; color: var(--steel); margin-top: 1vh; }
  .sumbody { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 1.1fr 1fr; gap: 4vw; }
  .sumbody h3 { font-family: var(--display); font-size: 3.4vh; font-weight: 700; margin-bottom: 1.4vh; }
  .linescore { width: 100%; height: auto; margin-bottom: 3vh; }
  .linescore th { font-size: 1.9vh; padding: 0 .8vw .8vh; }
  .linescore td { font-size: 3.4vh; padding: .6vh .8vw; text-align: center; }
  .linescore td.tm { text-align: left; }
  .linescore td.tot { font-weight: 800; }
  .linescore tr.us td { color: var(--gold); background: none; }
  .linescore tr.sec th { padding-top: 1.6vh; text-align: left; }
  .stat { margin-bottom: 1.6vh; }
  .stat .vals { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--display); font-size: 3.2vh; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .vals span.lbl { font-family: var(--body); font-size: 1.9vh; font-weight: 400; color: var(--steel); }
  .stat .bar { display: flex; height: .8vh; gap: .3vw; margin-top: .5vh; }
  .stat .bar i { display: block; height: 100%; border-radius: .4vh; }
  .goallist { display: flex; flex-direction: column; gap: 1.2vh; }
  .goallist .gl { background: var(--tile); border-radius: .6vh; padding: 1.1vh 1.2vw; font-size: 3.2vh; }
  .goallist .gl .ast { font-family: var(--body); font-size: 1.8vh; font-weight: 400; color: var(--steel); }
  .stars { display: flex; flex-direction: column; gap: 1.6vh; }
  .star { display: flex; align-items: center; gap: 1.6vw; background: var(--tile); border-radius: .6vh; padding: 1.4vh 1.6vw; }
  .star .n { font-family: var(--display); font-size: 6vh; font-weight: 800; color: var(--gold); width: 4ch; }
  .star img.head { width: 12vh; height: 12vh; border-radius: 50%; background: var(--rink); object-fit: cover; }
  .star .nm { font-family: var(--display); font-size: 4.4vh; font-weight: 700; }
  .star .ln { font-family: var(--display); font-size: 3vh; color: var(--steel); }
  .star .tl { margin-left: auto; width: 7vh; height: 7vh; }

  /* ---------- league view ---------- */
  #league { flex-direction: column; padding: 3.5vh 3vw 0; gap: 2.4vh; }
  .cols { position: relative; flex: 1; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 3vw; min-height: 0; padding-bottom: .5vh; }
  .cols > div { display: flex; flex-direction: column; min-height: 0; }
  h2 { font-family: var(--display); font-weight: 700; font-size: 4.4vh; height: 5.4vh; margin-bottom: 1.8vh; white-space: nowrap; overflow: hidden; display: flex; justify-content: space-between; align-items: baseline; }
  .now { display: flex; align-items: baseline; gap: 1vw; }
  .now .time { font-size: 4.4vh; font-weight: 700; font-variant-numeric: tabular-nums; }
  .now .date { font-family: var(--body); font-size: 2vh; font-weight: 400; color: var(--steel); }

  .games { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); gap: 1.4vh 1.2vw; }
  .games.many { grid-template-columns: 1fr 1fr 1fr; }
  .games.few { grid-auto-rows: minmax(0, 18vh); }
  .tile { background: var(--tile); padding: 1.2vh 1.4vw 1.2vh 1vw; display: grid; grid-template-columns: 1fr auto; align-content: center; row-gap: .8vh; border-left: .5vh solid transparent; border-radius: .6vh; }
  .tile.us { border-left-color: var(--gold); background: linear-gradient(90deg, rgba(252, 181, 20, .16), var(--tile) 70%); }
  .tile.live-game { box-shadow: inset 0 0 0 2px rgba(228, 0, 43, .55); }
  .tile .team { display: flex; align-items: center; gap: .9vw; font-family: var(--display); font-weight: 600; font-size: 3.8vh; }
  .tile .team img { width: 5.4vh; height: 5.4vh; }
  .tile .pts { font-family: var(--display); font-weight: 800; font-size: 4.6vh; line-height: 1; font-variant-numeric: tabular-nums; align-self: center; }
  .games.many .tile .team { font-size: 3.2vh; }
  .games.many .tile .team img { width: 4.4vh; height: 4.4vh; }
  .games.many .tile .pts { font-size: 3.8vh; }
  .tile .loser { color: var(--steel); }
  .tile .loser i.tc { opacity: .45; }
  .tile .status { grid-column: 1 / -1; font-size: 2vh; padding: .4vh 0 0 1.5vw; color: var(--steel); display: flex; align-items: center; gap: .6vw; }
  .tile .status.live { color: var(--ice); }
  .tile .status .live-dot { width: 1.2vh; height: 1.2vh; }
  .empty { color: var(--steel); font-size: 2.4vh; }

  .tablewrap { flex: 1; min-height: 0; overflow: hidden; }
  table.compact td { font-size: 3vh; padding: .3vh .6vw; }
  table.roomy td { font-size: 4vh; }
  table.aff { table-layout: fixed; }
  table.aff thead th:nth-child(1) { width: 6%; }
  table.aff thead th:nth-child(2) { width: 52%; }
  table.aff td { font-size: 3vh; padding: .35vh .6vw; }
  table.aff td.tm div, table.aff td.tm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.aff td.tm img { width: 3.6vh; height: 3.6vh; flex: none; }
  table.aff tr.sub th { padding: .7vh .6vw .3vh; font-size: 2.3vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table.aff tr.info th { font-family: var(--body); font-weight: 600; color: var(--ice); padding: .2vh .6vw; }
  table.aff tr.info th span { color: var(--gold); margin-right: .6vw; }
  table.roomy td.tm img.head { width: 10vh; height: 10vh; }
  table.roomy td.val { font-size: 3.4vh; color: var(--steel); }
  table.roomy td .ms { font-size: 6vh; }
  table.compact td.tm img { width: 3.8vh; height: 3.8vh; }
  table.compact td.ab img { width: 3vh; height: 3vh; }
  table.compact tr.sub th { padding: .9vh .6vw .3vh; font-size: 2.2vh; }
  table { width: 100%; height: 100%; border-collapse: collapse; }
  thead th { height: 4vh; }
  th { font-weight: 400; font-size: 1.9vh; color: var(--steel); text-align: right; padding: 0 .6vw 1vh; }
  th:nth-child(-n+2) { text-align: left; }
  td { font-family: var(--display); font-size: 3.6vh; font-weight: 600; padding: .6vh .6vw; text-align: right; font-variant-numeric: tabular-nums; border-top: 1px solid var(--rink); white-space: nowrap; }
  td.rank { color: var(--steel); width: 3ch; text-align: left; }
  td.tm { text-align: left; width: 100%; }
  td.tm div { display: flex; align-items: center; gap: .8vw; }
  td.tm span { overflow: hidden; text-overflow: ellipsis; }
  td.tm img { width: 4.8vh; height: 4.8vh; }
  td.tm img.head { border-radius: 50%; background: var(--rink); object-fit: cover; }
  td.tm small { font-family: var(--body); font-size: 1.8vh; font-weight: 400; color: var(--steel); }
  td.ab { font-size: 2.6vh; color: var(--steel); }
  td.ab div { display: flex; align-items: center; justify-content: flex-end; gap: .5vw; }
  td.ab img { width: 3.4vh; height: 3.4vh; }
  td.p { font-weight: 800; }
  td.gap.pos { color: #7FD08A; }
  td.gap.neg { color: var(--steel); }
  tr.us td { color: var(--gold); background: rgba(252, 181, 20, .10); }
  tr.us td.rank { box-shadow: inset .5vh 0 0 var(--gold); }
  tr.cut td { border-top: .4vh solid var(--steel); }
  tr.sub th { padding-top: 1.4vh; font-family: var(--display); font-size: 2.6vh; font-weight: 600; color: var(--ice); }
  #stBody tr.lead td.p { color: var(--gold); }
  .rotor { height: .5vh; background: var(--rink); margin-top: 1.6vh; }
  .rotor i { display: block; height: 100%; width: 0; background: var(--steel); }

  /* ---------- news ticker ---------- */
  .ticker { position: relative; display: flex; align-items: center; height: 4.8vh; margin: 0 -3vw; background: var(--rink); overflow: hidden; }
  .ticker .tl { position: relative; z-index: 2; height: 100%; display: flex; align-items: center; padding: 0 1.4vw 0 3vw; background: var(--rink); white-space: nowrap; font-family: var(--display); font-size: 2.6vh; font-weight: 700; color: var(--gold); box-shadow: 1.5vw 0 1.5vw var(--rink); }
  .ticker .track { display: flex; white-space: nowrap; will-change: transform; animation: crawl linear infinite; }
  .ticker .item { display: flex; align-items: center; gap: .8vw; padding-right: 2.4vw; font-size: 2.3vh; font-weight: 600; }
  .ticker .item small { font-weight: 400; color: var(--steel); }
  .ticker .item::before { content: ""; width: .9vh; height: .9vh; background: var(--gold); transform: rotate(45deg); margin-right: .6vw; }
  @keyframes crawl { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* ---------- bottom bar ---------- */
  .next { position: relative; display: flex; align-items: center; gap: 1.6vw; padding: 1.8vh 3vw; margin: 0 -3vw; background: var(--gold); color: var(--black); font-family: var(--display); }
  .next > * { white-space: nowrap; }
  .next .lbl { font-size: 3vh; font-weight: 600; }
  .chips { display: flex; gap: 1.8vw; min-width: 0; overflow: hidden; }
  .chip { display: flex; align-items: center; gap: .6vw; }
  .chip img { width: 5vh; height: 5vh; }
  .chip .a { font-size: 3vh; font-weight: 800; line-height: 1; }
  .chip .d { font-family: var(--body); font-size: 1.7vh; font-weight: 600; opacity: .75; margin-top: .3vh; }
  .chip.first .a { font-size: 3.6vh; }
  .next .rec { margin-left: auto; display: flex; flex-direction: column; gap: .4vh; padding-left: 1.8vw; border-left: 2px solid rgba(0,0,0,.35); }
  .next .rec b { font-size: 3vh; font-weight: 700; }
  .next .rec span { font-family: var(--body); font-size: 1.8vh; font-weight: 600; }
  .form { display: flex; gap: .45vw; align-items: center; }
  .form i { width: 1.9vh; height: 1.9vh; border-radius: 50%; display: block; }
  .form i.W { background: var(--black); }
  .form i.L { background: rgba(0, 0, 0, .22); }
  .form i.OTL { box-shadow: inset 0 0 0 .35vh var(--black); }
  .formwrap { display: flex; flex-direction: column; gap: .7vh; }
  .formkey { display: flex; align-items: center; gap: .9vw; font-family: var(--body); font-size: 1.6vh; font-weight: 600; }
  .formkey span { display: flex; align-items: center; gap: .3vw; }
  .formkey i { width: 1.2vh; height: 1.2vh; border-radius: 50%; display: block; }
  .formkey i.W { background: var(--black); }
  .formkey i.L { background: rgba(0, 0, 0, .22); }
  .formkey i.OTL { box-shadow: inset 0 0 0 .22vh var(--black); }
  .formkey .k { opacity: .7; }
  .next.gameday { padding: 2.6vh 3vw; }
  .next.gameday .lbl { font-size: 4vh; font-weight: 800; padding-right: 1vw; }
  .next.gameday .what { display: flex; align-items: center; gap: 1vw; font-size: 4.6vh; font-weight: 800; }
  .next.gameday .what img { width: 7vh; height: 7vh; }
  .next.gameday .what .vs { font-weight: 600; font-size: 3.4vh; }
  .next.gameday .when { margin-left: auto; font-size: 3.8vh; font-weight: 700; }
  .next.gameday .rec { margin-left: 0; }

  /* ---------- goal ---------- */
  #goal { position: fixed; inset: 0; background: var(--gold); color: var(--black); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 10; font-family: var(--display); }
  #goal.on { display: flex; animation: flash .5s steps(2) 6; }
  #goal .word { font-weight: 800; font-size: 30vh; line-height: .9; }
  #goal .who { display: flex; align-items: center; gap: 3vw; margin-top: 3vh; min-height: 22vh; }
  #goal .who img { width: 22vh; height: 22vh; border-radius: 50%; background: rgba(0,0,0,.12); object-fit: cover; }
  #goal .name { font-weight: 800; font-size: 9vh; line-height: 1; }
  #goal .assists { font-weight: 600; font-size: 4.4vh; margin-top: 1.2vh; }
  #goal .tag { display: inline-block; margin-top: 1.6vh; padding: .4vh 1.4vw; background: var(--black); color: var(--gold); font-size: 3.4vh; font-weight: 700; }
  @keyframes flash { 50% { background: var(--black); color: var(--gold); } }

  /* ---------- affiliates ---------- */
  .boardtag { position: absolute; top: 3vh; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 3.4vh; font-weight: 700; color: var(--gold); letter-spacing: .04em; }
  .boardtag:empty { display: none; }
  .boardtag b { display: inline-block; padding: .2vh .8vw; margin-right: .8vw; background: var(--gold); color: var(--black); border-radius: .4vh; font-size: 2.6vh; }
  #affBadge { position: fixed; left: 2vw; top: 2.4vh; z-index: 6; display: none; flex-direction: column; gap: .8vh; }
  #affBadge.alt { top: auto; bottom: 2vh; left: auto; right: 2vw; }
  #affBadge.on { display: flex; }
  .abadge { display: flex; align-items: center; gap: .8vw; background: var(--tile); border-radius: .6vh; padding: .8vh 1.2vw; font-family: var(--display); font-size: 2.8vh; font-weight: 600; }
  .abadge .lg { font-size: 1.8vh; padding: .1vh .5vw; background: var(--gold); color: var(--black); border-radius: .3vh; font-weight: 700; }
  .abadge .us { color: var(--gold); }
  .abadge img { width: 3.4vh; height: 3.4vh; }
  .abadge .st { font-family: var(--body); font-size: 1.8vh; color: var(--steel); }
  #affGoal { position: fixed; top: 0; left: 0; right: 0; z-index: 9; display: none; justify-content: center; align-items: center; gap: 2vw; padding: 2vh 3vw; background: var(--gold); color: var(--black); font-family: var(--display); font-size: 5vh; font-weight: 800; }
  #affGoal.on { display: flex; animation: flash .5s steps(2) 4; }
  #affGoal small { font-size: 3vh; font-weight: 600; }
  .tile .lgtag { font-size: 1.6vh; font-weight: 700; padding: 0 .4vw; border: 1px solid var(--gold); color: var(--gold); border-radius: .3vh; }

  /* ---------- legends and lineups ---------- */
  .legend { margin-top: 1.2vh; color: var(--steel); font-size: 1.6vh; }
  .legend:empty { display: none; }
  .lg-items { display: flex; flex-wrap: wrap; gap: .7vh 1.4vw; }
  .lg-item { display: inline-flex; align-items: center; gap: .5vw; white-space: nowrap; }
  .lg-item b { font-family: var(--display); font-size: 1.7vh; font-weight: 700; color: var(--ice);
               padding: .1vh .45vw; border: 1px solid rgba(126, 139, 149, .5); border-radius: .4vh; }
  .lg-note { margin-top: .7vh; font-style: italic; }
  .recent .legend .lg-items { justify-content: center; }
  #sumLegend { position: relative; flex-shrink: 0; }
  #summary { gap: 2vh; }
  .sumbody > div { min-height: 0; overflow: hidden; }
  .linescore { margin-bottom: 1.6vh; }
  .linescore td { font-size: 3vh; padding: .4vh .8vw; }
  .linescore td.tm img { width: 3.8vh; height: 3.8vh; }
  .stat { margin-bottom: 1vh; }
  .stat .vals { font-size: 2.8vh; }
  table.lineup { height: auto; table-layout: fixed; }
  table.lineup th { font-size: 1.7vh; padding: 0 .4vw .5vh; }
  table.lineup td { font-size: 2.1vh; padding: .15vh .4vw; border-top: 1px solid rgba(255,255,255,.04); }
  table.lineup td.tm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table.lineup td.tm small { font-size: 1.5vh; }
  table.lineup td.n { color: var(--steel); text-align: left; }
  table.lineup tr.sub th { padding: .7vh .4vw .2vh; font-size: 1.9vh; color: var(--gold); text-align: left; }
  table.lineup tr.scored td { color: var(--gold); }
  table.lineup.small td { font-size: 1.8vh; padding: .05vh .4vw; }
  table.lineup.small tr.sub th { padding: .4vh .4vw .1vh; font-size: 1.7vh; }
  .sumbody h3 .pg { font-family: var(--body); font-size: 1.8vh; font-weight: 400; color: var(--steel); margin-left: 1vw; }

  /* ---------- playoffs, offseason, extras ---------- */
  .side .goalie { font-family: var(--body); font-size: 2.2vh; color: var(--steel); }
  .side .goalie b { color: var(--ice); font-weight: 600; }
  .tile .series { grid-column: 1 / -1; padding-left: 1.5vw; font-size: 1.8vh; font-weight: 600; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .status { white-space: nowrap; line-height: 1.35; min-height: max-content; }
  .tile { align-content: safe center; }
  /* Tighter tiles when there are many games, so nothing gets cut off at the bottom */
  .games.tight .tile { padding: .7vh 1.2vw .7vh .9vw; row-gap: .3vh; }
  .games.tight .tile .team { font-size: 3.2vh; }
  .games.tight .tile .team img { width: 4.2vh; height: 4.2vh; }
  .games.tight .tile .pts { font-size: 3.8vh; }
  .games.tight .tile .status { font-size: 1.8vh; padding-top: .1vh; }
  .games.tighter .tile .team { font-size: 2.8vh; }
  .games.tighter .tile .team img { width: 3.4vh; height: 3.4vh; }
  .games.tighter .tile .pts { font-size: 3.2vh; }
  .games.tighter .tile .status { font-size: 1.6vh; }
  .games.tighter .tile .series { font-size: 1.5vh; }
  table.list td { font-size: 2.8vh; padding: .5vh .6vw; white-space: normal; }
  table.list td.tm span { white-space: normal; }
  table.list { table-layout: fixed; height: auto; }
  table.list td { line-height: 1.25; }
  table.list .tag2 { display: inline-block; overflow: visible; text-overflow: clip; white-space: nowrap; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  table.list td:first-child { width: 46%; }
  table.prospects td:first-child { width: auto; }
  table.prospects thead th:nth-child(1) { width: 2%; }
  table.prospects thead th:nth-child(2) { width: 40%; }
  table.prospects thead th:nth-child(3) { width: 28%; }
  table.prospects td { font-size: 2.6vh; }
  table.prospects td .dim, table.prospects td.dim { font-size: 2vh; }
  table.prospects thead th:nth-child(4) { width: 8%; }
  table.prospects td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table.prospects td.tm span { white-space: nowrap; }
  table.prospects td.tm img.head { width: 4vh; height: 4vh; flex: none; }
  table.list td small, table.list td .dim { font-family: var(--body); font-size: 1.9vh; font-weight: 400; color: var(--steel); }
  table.list td .tag2 { font-family: var(--body); font-size: 1.6vh; font-weight: 700; padding: 0 .4vw; border: 1px solid var(--gold); color: var(--gold); border-radius: .3vh; margin-right: .6vw; }
  table.bracket td { font-size: 3.2vh; padding: .6vh .6vw; }
  table.bracket td.w { font-weight: 800; width: 3ch; }
  table.bracket td.st { font-family: var(--body); font-size: 2vh; color: var(--steel); text-align: right; white-space: nowrap; }
  table.bracket tr.us td { color: var(--gold); }
  h2 { flex-shrink: 0; }
  .countdowns { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); gap: 1.4vh 1.2vw; }
  .cd { background: var(--tile); border-radius: .6vh; padding: 1.4vh 1.6vw; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: .8vh; }
  .cd .lbl { font-family: var(--display); font-size: 3vh; font-weight: 600; color: var(--steel); }
  .cd .days { font-family: var(--display); font-size: 7.5vh; font-weight: 800; line-height: 1; color: var(--gold); }
  .cd .days small { font-size: 3.4vh; color: var(--ice); margin-left: .6vw; }
  .cd .when { font-size: 2.2vh; color: var(--ice); display: flex; align-items: center; gap: .6vw; }
  .cd .when img { width: 4vh; height: 4vh; }
  .cd.otd { grid-column: 1 / -1; }
  .cd.otd .line { font-size: 2.4vh; line-height: 1.4; }
  .nightbox .notd { max-width: 60vw; text-align: center; font-size: 2.4vh; color: var(--steel); margin-top: 2vh; }

  /* ---------- night mode ---------- */
  #night { align-items: center; justify-content: center; background: var(--black); }
  .nightbox { display: flex; flex-direction: column; align-items: center; gap: 1.5vh; opacity: .4; transition: transform 2s ease; }
  .nightbox .ntime { font-family: var(--display); font-size: 22vh; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .nightbox .ndate { font-size: 2.8vh; color: var(--steel); }
  .nightbox .nnext { display: flex; align-items: center; gap: 1vw; margin-top: 2vh; font-family: var(--display); font-size: 4vh; font-weight: 600; color: var(--gold); }
  .nightbox .nnext img { width: 6vh; height: 6vh; }

  /* game-day countdown */
  .next.gameday .when { display: flex; flex-direction: column; align-items: flex-end; }
  .next.gameday .when small { font-family: var(--body); font-size: 2vh; font-weight: 600; opacity: .8; }

  /* opponent + milestone panels */
  td.val { font-size: 3.2vh; }
  td .ms { color: var(--gold); font-weight: 800; }
  .h2h { display: inline-flex; gap: .6vw; }
  .h2h b { font-weight: 700; }
  .h2h b.W { color: #7FD08A; } .h2h b.L { color: var(--steel); } .h2h b.OTL { color: var(--ice); }

  #err { position: fixed; right: 2vw; bottom: 1.5vh; font-size: 1.8vh; color: var(--steel); z-index: 5; }
  #err.stale { top: 1.5vh; bottom: auto; padding: .6vh 1.2vw; background: var(--lamp); color: var(--ice); font-size: 2.2vh; font-weight: 600; border-radius: .6vh; }

  @media (prefers-reduced-motion: reduce) {
    .live-dot, #goal.on, .ticker .track { animation: none; }
  }
</style>
</head>
<body>

<template id="rinkTpl">
  <div class="rink"><svg viewBox="0 0 2000 850" preserveAspectRatio="none" fill="none">
    <rect x="20" y="20" width="1960" height="810" rx="280" stroke="#EEF2F4" stroke-width="6"/>
    <line x1="1000" y1="20" x2="1000" y2="830" stroke="#E4002B" stroke-width="14"/>
    <line x1="750" y1="20" x2="750" y2="830" stroke="#2A5DB0" stroke-width="14"/>
    <line x1="1250" y1="20" x2="1250" y2="830" stroke="#2A5DB0" stroke-width="14"/>
    <line x1="130" y1="20" x2="130" y2="830" stroke="#E4002B" stroke-width="4"/>
    <line x1="1870" y1="20" x2="1870" y2="830" stroke="#E4002B" stroke-width="4"/>
    <circle cx="1000" cy="425" r="150" stroke="#2A5DB0" stroke-width="6"/>
    <circle cx="350" cy="225" r="150" stroke="#E4002B" stroke-width="5"/>
    <circle cx="350" cy="625" r="150" stroke="#E4002B" stroke-width="5"/>
    <circle cx="1650" cy="225" r="150" stroke="#E4002B" stroke-width="5"/>
    <circle cx="1650" cy="625" r="150" stroke="#E4002B" stroke-width="5"/>
  </svg></div>
</template>

<section id="board" class="view">
  <div class="corner-clock" data-clock></div>
  <div class="boardtag" id="boardTag"></div>
  <div class="matchup">
    <div class="side" id="awaySide"><img alt=""><div class="tname"></div><div class="sog"></div><div class="goalie"></div></div>
    <div class="scores"><div class="big" id="awayScore"></div><div class="dash"></div><div class="big" id="homeScore"></div></div>
    <div class="side" id="homeSide"><img alt=""><div class="tname"></div><div class="sog"></div><div class="goalie"></div></div>
  </div>
  <div class="clockline" id="clockline"></div>
  <div class="situ" id="situ"></div>
  <div class="boardfoot">
    <div class="pbox" id="penAway"></div>
    <div class="recent" id="recent"></div>
    <div class="pbox home" id="penHome"></div>
  </div>
</section>

<section id="summary" class="view">
  <div class="sumhead" id="sumHead"></div>
  <div class="sumbody">
    <div id="sumLeft"></div>
    <div id="sumRight"></div>
  </div>
  <div class="legend" id="sumLegend"></div>
</section>

<section id="league" class="view">
  <div class="cols">
    <div>
      <h2><span id="scoresTitle">Around the league</span><span class="now"><span class="time" data-clock></span><span class="date" id="date"></span></span></h2>
      <div class="games" id="games"></div>
      <div class="countdowns" id="countdowns" style="display:none"></div>
    </div>
    <div>
      <h2><span id="stTitle">Standings</span></h2>
      <div class="tablewrap"><table><thead id="stHead"></thead><tbody id="stBody"></tbody></table></div>
      <div class="legend" id="panelLegend"></div>
      <div class="rotor"><i id="rotor"></i></div>
    </div>
  </div>
  <div class="ticker" id="ticker" style="display:none"><span class="tl" id="tickerLbl">News</span><div class="track" id="track"></div></div>
  <div class="next" id="next"></div>
</section>

<section id="night" class="view">
  <div class="nightbox" id="nightBox">
    <div class="ntime" data-clock></div>
    <div class="ndate" id="nDate"></div>
    <div class="notd" id="nOtd"></div>
    <div class="nnext" id="nNext"></div>
  </div>
</section>

<div id="soundHint" style="display:none;position:fixed;left:50%;bottom:3vh;transform:translateX(-50%);z-index:11;padding:1vh 1.6vw;background:var(--lamp);color:var(--ice);font:600 2.2vh var(--body);border-radius:.6vh">Sound is blocked by the browser. Click anywhere on the page to turn it on.</div>
<div id="affBadge"></div>
<div id="affGoal"></div>

<div id="goal">
  <div class="word">Goal</div>
  <div class="who" id="goalWho"></div>
</div>
<div id="err"></div>

<script>
const TEAM_NAMES = {ANA:"Ducks",BOS:"Bruins",BUF:"Sabres",CAR:"Hurricanes",CBJ:"Blue Jackets",CGY:"Flames",CHI:"Blackhawks",COL:"Avalanche",DAL:"Stars",DET:"Red Wings",EDM:"Oilers",FLA:"Panthers",LAK:"Kings",MIN:"Wild",MTL:"Canadiens",NJD:"Devils",NSH:"Predators",NYI:"Islanders",NYR:"Rangers",OTT:"Senators",PHI:"Flyers",PIT:"Penguins",SEA:"Kraken",SJS:"Sharks",STL:"Blues",TBL:"Lightning",TOR:"Maple Leafs",UTA:"Mammoth",VAN:"Canucks",VGK:"Golden Knights",WPG:"Jets",WSH:"Capitals"};
// Each team's most recognizable color, brightened where needed to read on black.
const TEAM_COLORS = {ANA:"#F47A38",BOS:"#FFB81C",BUF:"#2E6FD8",CAR:"#CE1126",CBJ:"#CE1126",CGY:"#E0263B",CHI:"#CF0A2C",COL:"#8B2E4D",DAL:"#00A65A",DET:"#CE1126",EDM:"#FF4C00",FLA:"#C8102E",LAK:"#A2AAAD",MIN:"#1F8A55",MTL:"#AF1E2D",NJD:"#CE1126",NSH:"#FFB81C",NYI:"#F47D30",NYR:"#1E5BD6",OTT:"#C52032",PHI:"#F74902",PIT:"#FCB514",SEA:"#99D9D9",SJS:"#00A3AD",STL:"#2B59C3",TBL:"#2F64C9",TOR:"#2B5BB5",UTA:"#69B3E7",VAN:"#00843D",VGK:"#B4975A",WPG:"#2E6FD8",WSH:"#C8102E"};
const DIV_SHORT = {Metropolitan: "Metro", Atlantic: "Atlantic", Central: "Central", Pacific: "Pacific"};
const $ = id => document.getElementById(id);
let hornAudio = null;
let lastAffGoal = null;
let S = null, build = null, lastGoal = null, rotIdx = 0, rotTimer = null, goalUntil = 0, newsKey = "";

document.querySelectorAll("#board, #summary, #league").forEach(v => v.prepend($("rinkTpl").content.cloneNode(true)));

const ordinal = n => { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const periodLabel = g => g.periodType === "OT" ? "Overtime" : g.periodType === "SO" ? "Shootout" : `${ordinal(g.period)} period`;
const localTime = iso => new Date(iso).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
const logoUrl = (t) => t.league ? (t.logo || "") : t.abbrev ? `https://assets.nhle.com/logos/nhl/svg/${t.abbrev}_dark.svg` : (t.logo || "");
const logoImg = (t) => {
  const url = logoUrl(t);
  if (!url) return `<img alt="" style="visibility:hidden">`;
  const retry = t.logo && t.logo !== url ? `this.onerror=function(){this.style.visibility='hidden'};this.src='${t.logo}'` : "this.style.visibility='hidden'";
  return `<img src="${url}" alt="" onerror="this.onerror=null;${retry}">`;
};
const headImg = (url, cls = "head") => `<img class="${cls}" src="${url || ""}" alt="" onerror="this.style.visibility='hidden'">`;
const nameOf = t => (t.name && t.name !== t.abbrev) ? t.name : (TEAM_NAMES[t.abbrev] || t.abbrev);
const teamRow = abbrev => (S.standings || []).find(t => t.abbrev === abbrev);
const isToday = iso => new Date(iso).toDateString() === new Date().toDateString();
const color = a => TEAM_COLORS[a] || "#7E8B95";
// Affiliate teams get gold when it's ours, gray otherwise (their codes can clash with NHL ones).
const ourCode = league => league ? ((S.affiliates || []).find(a => a.league === league) || {}).code : S.team;
const tcBar = (a, league) => `<i class="tc" style="background:${league ? (a === ourCode(league) ? "#FCB514" : "#5B6670") : color(a)}"></i>`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function pickTv(g) {
  const tv = g.tv || [];
  const ourMarket = g.home.abbrev === S.team ? "H" : "A";
  const pick = tv.find(b => b.market === ourMarket && b.country === "US")
            || tv.find(b => b.market === "N" && b.country === "US")
            || tv.find(b => b.country === "US") || tv[0];
  return pick ? pick.network : "";
}

/* ---------- clock ---------- */
function tick() {
  const now = new Date();
  const t = now.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  document.querySelectorAll("[data-clock]").forEach(el => el.textContent = t);
  $("date").textContent = $("nDate").textContent = now.toLocaleDateString([], {weekday: "long", month: "short", day: "numeric"});
}

/* ---------- live / pregame scoreboard ---------- */
function goalLine(g, league) {
  const tags = [g.strength === "pp" ? "PP" : g.strength === "sh" ? "SH" : "", g.en ? "EN" : ""].filter(Boolean);
  return `<div class="gl">${tcBar(g.team, league)}<span class="t">${g.time} ${g.period}</span>
    <span>${esc(g.scorer)}${g.total ? ` (${g.total})` : ""}</span>${tags.map(t => `<span class="tag">${t}</span>`).join("")}
    <span class="sc">${g.away}-${g.home}</span></div>`;
}

function playoffTag(g) {
  const st = g && g.series;
  if (!st || !st.text) return "";
  return `<b>PLAYOFFS</b>${esc(st.title || "")}${st.game ? `, Game ${st.game}` : ""}: ${esc(st.text)}`;
}

function goalieFor(g, key, opts) {
  if (opts.us && opts.us !== S.team) return g[key].goalie ? `G <b>${esc(g[key].goalie)}</b>` : "";   // affiliate
  const L = S.lineup;
  if (!L || L.game !== g.id) return "";
  const side = L[key === "away" ? "away" : "home"];
  const first = side && (side.goalies || [])[0];
  if (!first || !first.name) return "";
  return `${side.confirmed ? "Starting" : "Goalie"} <b>${esc(first.name)}</b>`;
}

function renderBoard(g, mode, opts = {}) {
  const us = opts.us || S.team, D = opts.details || S.details || {};
  $("boardTag").innerHTML = opts.tag || playoffTag(g);
  for (const key of ["away", "home"]) {
    const t = g[key], side = $(key + "Side"), isUs = t.abbrev === us;
    side.classList.toggle("us", isUs);
    const img = side.querySelector("img");
    if (img.dataset.abbrev !== t.abbrev) {
      img.dataset.abbrev = t.abbrev;
      // Try the feed's own logo once, then hide the slot instead of showing a broken image.
      img.onerror = () => {
        if (t.logo && !img.dataset.retried && img.src !== t.logo) { img.dataset.retried = "1"; img.src = t.logo; }
        else img.style.visibility = "hidden";
      };
      delete img.dataset.retried;
      img.src = logoUrl(t);
      img.style.visibility = logoUrl(t) ? "visible" : "hidden";
    }
    side.querySelector(".tname").textContent = nameOf(t);
    side.querySelector(".sog").innerHTML = (mode !== "pregame" && t.sog != null) ? `Shots <b>${t.sog}</b>` : "";
    side.querySelector(".goalie").innerHTML = goalieFor(g, key, opts);
    const big = $(key + "Score");
    big.textContent = mode === "pregame" ? "" : (t.score ?? 0);
    big.classList.toggle("us", isUs);
  }
  document.querySelector("#board .dash").style.visibility = mode === "pregame" ? "hidden" : "visible";

  const cl = $("clockline");
  if (mode === "pregame") {
    const tv = pickTv(g);
    cl.innerHTML = `<span class="period">Puck drop</span><span class="clock">${localTime(g.start)}</span>${tv ? `<span class="period">${tv}</span>` : ""}`;
  } else if (g.intermission) {
    cl.innerHTML = `<span class="period">${ordinal(g.period)} intermission</span><span class="clock">${g.clock || ""}</span>`;
  } else {
    cl.innerHTML = `<span class="live-dot"></span><span class="period">${periodLabel(g)}</span><span class="clock">${g.clock || ""}</span>`;
  }

  const s = mode === "live" && g.situation;
  let html = "";
  if (s && s.pp) html = `<span class="${s.pp === us ? "" : "them"}">Power play ${TEAM_NAMES[s.pp] || s.pp}${s.time ? "  " + s.time : ""}</span>`;
  else if (s && s.en) html = `<span class="${s.en === us ? "" : "them"}">Empty net ${TEAM_NAMES[s.en] || s.en}</span>`;
  $("situ").innerHTML = html;

  // Penalty boxes and recent goals
  const pens = mode === "live" ? (D.penalties || []) : [];
  for (const key of ["away", "home"]) {
    const mine = pens.filter(p => p.team === g[key].abbrev);
    $(key === "away" ? "penAway" : "penHome").innerHTML = mine.length
      ? `<div class="pen-lbl">Penalty box</div>` + mine.map(p => `<div class="pen">${tcBar(p.team)}<div><div class="who">${esc(p.player)}</div><div class="why">${esc(p.infraction)}</div></div><div class="left">${p.left}</div></div>`).join("")
      : "";
  }
  const goals = (D.goals || []).slice(-3).reverse();
  const tagged = goals.some(x => x.strength === "pp" || x.strength === "sh" || x.en || x.total);
  $("recent").innerHTML = mode === "live" && goals.length
    ? `<div class="lbl">Scoring</div>` + goals.map(x => goalLine(x, g.league)).join("") + (tagged ? `<div class="legend">${legendHTML(LEG.scoring)}</div>` : "") : "";
}

/* ---------- intermission / final summary ---------- */
function lineupTable(team, L, isUs) {
  const title = `<h3>${logoImg(team).replace("<img", '<img style="width:4vh;height:4vh;vertical-align:middle;margin-right:.6vw"')}${esc(nameOf(team))}</h3>`;
  if (!L) return title + `<div class="empty">Lineup not available for this game.</div>`;
  const sk = (L.skaters || []).slice();
  const hasToi = sk.some(p => p.toi), hasSog = sk.some(p => p.sog != null), hasPm = sk.some(p => p.pm != null);
  const pm = v => v == null ? "" : (v > 0 ? "+" + v : v);
  const head = `<tr><th style="width:4ch">#</th><th style="width:40%">Player</th><th>G</th><th>A</th><th>PTS</th>${hasSog ? "<th>SOG</th>" : ""}${hasPm ? "<th>+/-</th>" : ""}${hasToi ? "<th>TOI</th>" : ""}</tr>`;
  const cols = 5 + hasSog + hasPm + hasToi;
  const row = p => `<tr class="${p.pts > 0 && isUs ? "scored" : ""}"><td class="n">${p.num ?? ""}</td><td class="tm">${esc(p.name)} <small>${esc(p.pos || "")}</small></td>
    <td>${p.g}</td><td>${p.a}</td><td class="p">${p.pts}</td>${hasSog ? `<td>${p.sog ?? ""}</td>` : ""}${hasPm ? `<td>${pm(p.pm)}</td>` : ""}${hasToi ? `<td>${p.toi ?? ""}</td>` : ""}</tr>`;
  const byPts = (a, b) => (b.pts - a.pts) || ((b.sog || 0) - (a.sog || 0));
  const group = (label, list) => list.length ? `<tr class="sub"><th colspan="${cols}">${label}</th></tr>` + list.sort(byPts).map(row).join("") : "";
  const goalies = (L.goalies || []).map(p => `<tr><td class="n">${p.num ?? ""}</td><td class="tm">${esc(p.name)}${p.starter ? " <small>started</small>" : ""}</td>
    <td colspan="2">${p.sa ?? ""} <small>saves</small></td><td colspan="${cols - 4}">${p.svp != null ? Number(p.svp).toFixed(3).replace(/^0/, "") + " <small>SV%</small>" : ""}${p.toi ? `  ${p.toi} <small>TOI</small>` : ""}</td></tr>`).join("");
  return title + `<table class="lineup"><thead>${head}</thead><tbody>
    ${group("Forwards", sk.filter(p => p.group !== "D"))}${group("Defense", sk.filter(p => p.group === "D"))}
    ${goalies ? `<tr class="sub"><th colspan="${cols}">Goalies</th></tr>${goalies}` : ""}</tbody></table>`;
}

function fitLineups() {
  const body = document.querySelector("#summary .sumbody");
  document.querySelectorAll("#summary table.lineup").forEach(t => {
    if (t.parentElement.scrollHeight > body.clientHeight + 2) t.classList.add("small");
  });
}

function renderSummary(g, mode, opts = {}) {
  const us = opts.us || S.team, D = opts.details || S.details || {};
  const side = k => `<div class="team ${k} ${g[k].abbrev === us ? "us" : ""}">${k === "home" ? nameOf(g[k]) : ""}${logoImg(g[k])}${k === "away" ? nameOf(g[k]) : ""}</div>`;
  let status;
  if (mode === "final") status = `${opts.tag ? opts.tag + "  " : ""}Final${g.lastPeriodType && g.lastPeriodType !== "REG" ? " / " + g.lastPeriodType : ""}`;
  else status = `${opts.tag ? opts.tag + "  " : ""}${ordinal(g.period)} intermission  ${g.clock || ""}`;
  if (g.series && g.series.text) status += `   ${g.series.text}`;
  $("sumHead").innerHTML = `${side("away")}
    <div class="mid"><div class="sc"><span class="${g.away.abbrev === us ? "us" : ""}">${g.away.score ?? 0}</span><i class="dash"></i><span class="${g.home.abbrev === us ? "us" : ""}">${g.home.score ?? 0}</span></div>
    <div class="status">${status}</div></div>${side("home")}`;

  // Line score: goals and shots by period
  const labels = ["1st", "2nd", "3rd"];
  for (const p of [...(D.periods || []), ...(D.shots || [])]) if (!labels.includes(p.label)) labels.push(p.label);
  const val = (rows, lbl, k) => { const r = (rows || []).find(x => x.label === lbl); return r ? r[k] : "–"; };
  const tot = (rows, k) => (rows || []).reduce((a, r) => a + (Number(r[k]) || 0), 0);
  const row = (rows, k, total) => `<tr class="${g[k].abbrev === us ? "us" : ""}"><td class="tm"><div>${logoImg(g[k])}${g[k].abbrev}</div></td>
    ${labels.map(l => `<td>${val(rows, l, k)}</td>`).join("")}<td class="tot">${total}</td></tr>`;
  const cols = labels.length + 2;
  const lineScore = `<table class="linescore"><thead><tr><th></th>${labels.map(l => `<th style="text-align:center">${l}</th>`).join("")}<th style="text-align:center">T</th></tr></thead><tbody>
    <tr class="sec"><th colspan="${cols}">Goals</th></tr>
    ${row(D.periods, "away", (D.totals && D.totals.away) ?? g.away.score ?? 0)}${row(D.periods, "home", (D.totals && D.totals.home) ?? g.home.score ?? 0)}
    ${D.shots && D.shots.length ? `<tr class="sec"><th colspan="${cols}">Shots</th></tr>${row(D.shots, "away", tot(D.shots, "away"))}${row(D.shots, "home", tot(D.shots, "home"))}` : ""}
  </tbody></table>`;

  const fmt = (k, v) => k === "faceoffWinningPctg" && typeof v === "number" ? Math.round(v * (v <= 1 ? 100 : 1)) + "%" : (v ?? "–");
  const stats = (D.stats || []).filter(s => s.key !== "sog").map(s => {
    const a = parseFloat(s.away), h = parseFloat(s.home);
    const numeric = s.key !== "powerPlay" && !isNaN(a) && !isNaN(h) && a + h > 0;
    const bar = numeric ? `<div class="bar"><i style="flex:${a};background:${color(g.away.abbrev)}"></i><i style="flex:${h};background:${color(g.home.abbrev)}"></i></div>` : "";
    return `<div class="stat"><div class="vals"><span>${fmt(s.key, s.away)}</span><span class="lbl">${s.label}</span><span>${fmt(s.key, s.home)}</span></div>${bar}</div>`;
  }).join("");
  // Every 20 seconds, flip between the game summary and the full lineups (when we have them).
  const L = D.lineups;
  if (L && (L.away || L.home) && Math.floor(Date.now() / 20000) % 2 === 1) {
    $("sumLeft").innerHTML = lineupTable(g.away, L.away, g.away.abbrev === us);
    $("sumRight").innerHTML = lineupTable(g.home, L.home, g.home.abbrev === us);
    $("sumLegend").innerHTML = legendHTML(LEG.lineup);
    fitLineups();
    return;
  }
  $("sumLegend").innerHTML = legendHTML(LEG.summary);
  $("sumLeft").innerHTML = lineScore + stats;

  if (mode === "final" && (D.stars || []).length) {
    $("sumRight").innerHTML = `<h3>Three stars</h3><div class="stars">${D.stars.map(s => `
      <div class="star"><span class="n">${"★".repeat(s.star || 1)}</span>${headImg(s.headshot)}
        <div><div class="nm">${esc(s.name)}</div><div class="ln">${s.team} ${s.pos || ""}  ${esc(s.line)}</div></div>
        <span class="tl">${logoImg({abbrev: s.team})}</span></div>`).join("")}</div>`;
  } else {
    const goals = D.goals || [];
    $("sumRight").innerHTML = `<h3>Scoring</h3><div class="goallist">${goals.length ? goals.map(gl => {
      const tags = [gl.strength === "pp" ? "PP" : gl.strength === "sh" ? "SH" : "", gl.en ? "EN" : ""].filter(Boolean);
      const ast = gl.assists.length ? gl.assists.map(a => `${esc(a.name)}${a.num ? ` (${a.num})` : ""}`).join(", ") : "Unassisted";
      return `<div class="gl">${tcBar(gl.team, g.league)}<span class="t">${gl.time} ${gl.period}</span>
        <div><div>${esc(gl.scorer)}${gl.total ? ` (${gl.total})` : ""} ${tags.map(t => `<span class="tag">${t}</span>`).join(" ")}</div><div class="ast">${ast}</div></div>
        <span class="sc">${gl.away}-${gl.home}</span></div>`;
    }).join("") : `<div class="empty">No goals yet.</div>`}</div>`;
  }
}

/* ---------- league view: scores ---------- */
function gameTile(g) {
  const us = ourCode(g.league);
  const isUs = g.away.abbrev === us || g.home.abbrev === us;
  const started = g.away.score != null;
  const done = g.state === "FINAL" || g.state === "OFF";
  const live = g.state === "LIVE" || g.state === "CRIT";
  const loser = done && g.away.score !== g.home.score ? (g.away.score < g.home.score ? "away" : "home") : null;
  const row = (k) => `<div class="team ${loser === k ? "loser" : ""}">${tcBar(g[k].abbrev, g.league)}${logoImg(g[k])}${g[k].abbrev}</div>
                      <div class="pts ${loser === k ? "loser" : ""}">${started ? g[k].score : ""}</div>`;
  let status;
  if (done) status = `Final${g.lastPeriodType && g.lastPeriodType !== "REG" ? " / " + g.lastPeriodType : ""}`;
  else if (live) status = `<span class="live-dot"></span>${g.intermission ? ordinal(g.period) + " int." : periodLabel(g) + " " + (g.clock || "")}`;
  else status = g.start ? localTime(g.start) : "Scheduled";
  if (g.league) status = `<span class="lgtag">${g.league}</span>` + status;
  const seriesLine = g.series && g.series.text ? `<div class="series">${esc(g.series.text)}</div>` : "";
  return `<div class="tile ${isUs ? "us" : ""} ${live ? "live-game" : ""}">${row("away")}${row("home")}<div class="status ${live ? "live" : ""}">${status}</div>${seriesLine}</div>`;
}

function renderScores() {
  const recap = S.last_night || [];
  const affs = S.affiliates || [];
  const affGames = affs.flatMap(a => recap.length ? (a.yesterday || []) : (a.today || []));
  const games = [...affGames, ...(recap.length ? recap : (S.scores || []))];
  $("scoresTitle").textContent = recap.length ? "Last night" : "Around the league";
  const list = games.slice(0, 15);
  $("games").classList.toggle("many", list.length > 8);
  $("games").classList.toggle("few", list.length <= 4);
  $("games").classList.remove("tight", "tighter");
  const off = S.offseason && !list.length;
  $("games").style.display = off ? "none" : "";
  $("countdowns").style.display = off ? "grid" : "none";
  if (off) { $("scoresTitle").textContent = "Offseason"; renderCountdowns(); return; }
  $("games").innerHTML = list.length ? list.map(gameTile).join("") : `<div class="empty">No NHL games today.</div>`;
  fitTiles();
}

// If any tile's contents don't fit, step down to smaller text and logos.
function fitTiles() {
  const box = $("games");
  // A tile overflows if its last line ends below the tile (or its first line starts above it).
  const overflowing = () => [...box.querySelectorAll(".tile")].some(t => {
    const tr = t.getBoundingClientRect(), kids = [...t.children].filter(k => k.offsetHeight);
    if (!kids.length) return false;
    const top = Math.min(...kids.map(k => k.getBoundingClientRect().top));
    const bottom = Math.max(...kids.map(k => k.getBoundingClientRect().bottom));
    return bottom > tr.bottom - 3 || top < tr.top + 3;
  });
  for (const cls of ["tight", "tighter"]) {
    if (!overflowing()) return;
    box.classList.add(cls);
  }
}

function daysUntil(iso) {
  const d = new Date(iso.length <= 10 ? iso + "T12:00:00" : iso);
  return Math.max(0, Math.ceil((d - Date.now()) / 86400000));
}

function renderCountdowns() {
  const ev = (S.offseason && S.offseason.events) || [];
  const cards = ev.map(e => {
    const n = daysUntil(e.date);
    const d = new Date(e.date.length <= 10 ? e.date + "T12:00:00" : e.date);
    const when = e.opp
      ? `${logoImg({abbrev: e.opp})}${e.home ? "vs" : "at"} ${TEAM_NAMES[e.opp] || e.opp}, ${d.toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"})}`
      : `${d.toLocaleDateString([], {weekday: "long", month: "long", day: "numeric"})}${e.estimated ? " (estimated)" : ""}`;
    return `<div class="cd"><div class="lbl">${esc(e.label)}</div><div class="days">${n}<small>${n === 1 ? "day" : "days"}</small></div><div class="when">${when}</div></div>`;
  });
  const otd = (S.on_this_day || []);
  if (otd.length) cards.push(`<div class="cd otd"><div class="lbl">On this day in Penguins history</div>${otd.map(l => `<div class="line">${esc(l)}</div>`).join("")}</div>`);
  $("countdowns").innerHTML = cards.join("") || `<div class="empty">Enjoy the summer.</div>`;
}

/* ---------- legends: what the numbers mean ---------- */
const LEG = {
  standings: {items: [["GP", "games played"], ["W", "wins"], ["L", "regulation losses"], ["OT", "overtime/shootout losses"],
                      ["PTS", "points (win 2, OT loss 1)"], ["Strk", "streak (W2 = won last 2)"]],
              note: "Top 3 in each division make the playoffs. Teams below the line can still earn a wild card."},
  wildcard: {items: [["GP", "games played"], ["W", "wins"], ["L", "losses"], ["OT", "OT/SO losses"], ["PTS", "points"],
                     ["Gap", "points ahead of 9th, or behind the last spot"]],
             note: "Top 2 take the wild cards"},
  leaders: {items: [["GP", "games"], ["G", "goals"], ["A", "assists"], ["PTS", "points"], ["Record", "wins-losses-OT losses"],
                    ["SV%", "share of shots saved"], ["GAA", "goals allowed per game"]]},
  league: {items: [["Points", "goals + assists"], ["Goalie wins", "games won in net"]], note: "Season totals across the NHL"},
  prospects: {items: [["GP", "games this season"], ["Stats", "goals-assists-points"], ["SV%", "share of shots saved (goalies)"]]},
  goalies: {items: [["Record", "wins-losses-OT losses"], ["SV%", "share of shots saved (.910 = 91%)"], ["GAA", "goals allowed per game"]]},
  bracket: {items: [["Numbers", "series wins"]], note: "First to 4 wins moves on"},
  affiliate: {items: [["GP", "games played"], ["W", "wins"], ["L", "regulation losses"], ["OT", "OT/SO losses"], ["PTS", "points"]]},
  opponent: {items: [["Last 10", "W-L-OT over the last 10 games"], ["Streak", "current run (W2 = won last 2)"],
                     ["Season series", "games vs. the Penguins this year"]]},
  milestones: {note: "Career regular-season totals and how many more to the next round number"},
  lineup: {items: [["#", "jersey"], ["G", "goals"], ["A", "assists"], ["PTS", "points"], ["SOG", "shots on goal"],
                   ["+/-", "goals for minus against on ice"], ["TOI", "time on ice"], ["Saves", "saves/shots faced"], ["SV%", "save percentage"]]},
  summary: {items: [["T", "total"], ["Faceoffs", "share won"], ["PP", "power-play goal"], ["SH", "shorthanded goal"],
                    ["EN", "empty-net goal"], ["(8)", "player's season total"]],
            note: "Line score shows goals and shots by period; bars compare the two teams"},
  scoring: {items: [["PP", "power play"], ["SH", "shorthanded"], ["EN", "empty net"], ["(8)", "season goals"]]},
};

// Render a legend as small key/definition pairs, with an optional one-line note.
function legendHTML(L) {
  if (!L) return "";
  const items = (L.items || []).map(([k, d]) => `<span class="lg-item"><b>${esc(k)}</b>${esc(d)}</span>`).join("");
  return (items ? `<div class="lg-items">${items}</div>` : "") + (L.note ? `<div class="lg-note">${esc(L.note)}</div>` : "");
}

/* ---------- league view: rotating right panel ---------- */
const STANDINGS_HEAD = `<tr><th></th><th>Team</th><th>GP</th><th>W</th><th>L</th><th>OT</th><th>PTS</th><th>Strk</th></tr>`;

function standingsRows(rows, cut, gapFn) {
  return rows.map((t, i) => {
    const gap = gapFn ? gapFn(t, i) : null;
    return `<tr class="${t.abbrev === S.team ? "us" : ""} ${i === cut ? "cut" : ""}">
      <td class="rank">${i + 1}</td>
      <td class="tm"><div>${logoImg(t)}<span>${nameOf(t)}</span></div></td>
      <td>${t.gp}</td><td>${t.w}</td><td>${t.l}</td><td>${t.otl}</td><td class="p">${t.pts}</td>
      ${gapFn ? `<td class="gap ${gap > 0 ? "pos" : gap < 0 ? "neg" : ""}">${gap > 0 ? "+" + gap : gap}</td>` : `<td>${t.streak}</td>`}
    </tr>`;
  }).join("");
}

function leadersBody(L) {
  const sk = L.skaters.map((p, i) => `
    <tr class="${i === 0 ? "lead" : ""}">
      <td class="rank">${i + 1}</td>
      <td class="tm"><div>${headImg(p.headshot)}<span>${esc(p.name)} <small>${p.pos || ""}</small></span></div></td>
      <td>${p.gp}</td><td>${p.g}</td><td>${p.a}</td><td class="p">${p.pts}</td>
    </tr>`).join("");
  const gl = L.goalies.map(p => `
    <tr>
      <td class="rank"></td>
      <td class="tm"><div>${headImg(p.headshot)}<span>${esc(p.name)}</span></div></td>
      <td>${p.gp}</td><td>${p.w}-${p.l}-${p.otl}</td><td>${p.svp != null ? p.svp.toFixed(3).replace(/^0/, "") : ""}</td><td class="p">${p.gaa != null ? p.gaa.toFixed(2) : ""}</td>
    </tr>`).join("");
  return sk + `<tr class="sub"><th></th><th>Goalies</th><th>GP</th><th>Record</th><th>SV%</th><th>GAA</th></tr>` + gl;
}

function leagueLeadersBody(LL) {
  const section = (title, rows) => `<tr class="sub"><th></th><th colspan="3">${title}</th></tr>` + rows.map((p, i) => `
    <tr class="${p.team === S.team ? "us" : ""}">
      <td class="rank">${i + 1}</td>
      <td class="tm"><div>${headImg(p.headshot)}<span>${esc(p.name)}</span></div></td>
      <td class="ab"><div>${logoImg({abbrev: p.team})}${p.team}</div></td>
      <td class="p">${p.value}</td>
    </tr>`).join("");
  return section("Points", LL.points || []) + section("Goals", LL.goals || []) + section("Goalie wins", LL.wins || []);
}

function opponentBody(O) {
  const t = teamRow(O.abbrev);
  const name = TEAM_NAMES[O.abbrev] || O.abbrev;
  const info = (label, value) => `<tr><td class="tm" style="width:auto">${label}</td><td class="val" colspan="2">${value}</td></tr>`;
  const h2h = O.h2h || [];
  const tally = r => h2h.filter(x => x.r === r).length;
  const series = h2h.length
    ? `${TEAM_NAMES[S.team]} ${tally("W")}-${tally("L")}-${tally("OTL")} <span class="h2h">${h2h.map(x => `<b class="${x.r}">${x.r === "OTL" ? "OTL" : x.r} ${x.us}-${x.them}</b>`).join("")}</span>`
    : "First meeting this season";
  let rows = "";
  if (t) rows += info("Record", `${t.w}-${t.l}-${t.otl}, ${t.pts} pts`)
              + info("Standing", `${ordinal(t.divSeq)} in the ${t.division}`)
              + info("Last 10", t.l10) + info("Streak", t.streak || "–");
  rows += info("Season series", series);
  if ((O.scorers || []).length) {
    rows += `<tr class="sub"><th colspan="2">Top scorers</th><th style="text-align:right">PTS</th></tr>`;
    rows += O.scorers.map(p => `<tr><td class="tm"><div>${headImg(p.headshot)}<span>${esc(p.name)} <small>${p.g}G ${p.a}A</small></span></div></td><td></td><td class="p">${p.pts}</td></tr>`).join("");
  }
  return rows;
}

function bracketBody(P) {
  return P.series.map(s => {
    const ours = [s.top.abbrev, s.bottom.abbrev].includes(S.team);
    const t = s.top, b = s.bottom;
    return `<tr class="${ours ? "us" : ""}">
      <td class="tm" style="width:auto"><div>${logoImg(t)}<span>${t.abbrev || "TBD"}</span></div></td><td class="w">${t.wins ?? ""}</td>
      <td class="w">${b.wins ?? ""}</td><td class="tm" style="width:auto"><div>${logoImg(b)}<span>${b.abbrev || "TBD"}</span></div></td>
      <td class="st">${esc(s.text || "")}</td></tr>`;
  }).join("") + (P.ours && !P.series.some(s => [s.top.abbrev, s.bottom.abbrev].includes(S.team))
    ? `<tr class="sub"><th colspan="5">${TEAM_NAMES[S.team]}: ${esc(P.ours.text)} (${esc(P.ours.label.replace(/-/g, " "))})</th></tr>` : "");
}

function injuryRows(list, n) {
  return list.slice(0, n).map(i => `<tr><td class="tm" style="width:auto">${esc(i.name)} <small>${esc(i.pos || "")}</small></td>
    <td>${esc(i.status || "")}</td><td class="dim">${esc(i.injury || "")}${i.back ? `, back ${new Date(i.back + (i.back.length <= 10 ? "T12:00:00" : "")).toLocaleDateString([], {month: "short", day: "numeric"})}` : ""}</td></tr>`).join("");
}

function lineupBody(O) {
  const L = S.lineup || {};
  const g = S.game || {};
  const goalies = (key, abbrev) => {
    const side = L[key];
    if (!side || !(side.goalies || []).length) return "";
    const head = `<tr class="sub"><th colspan="3">${TEAM_NAMES[abbrev] || abbrev} goalies${side.confirmed ? " (starting)" : ""}</th></tr>`;
    return head + side.goalies.map(x => `<tr><td class="tm" style="width:auto">${esc(x.name)}</td><td>${esc(x.record || "")}</td>
      <td class="dim">${x.svp != null ? Number(x.svp).toFixed(3).replace(/^0/, "") + " SV%" : ""}${x.gaa != null ? `, ${Number(x.gaa).toFixed(2)} GAA` : ""}</td></tr>`).join("");
  };
  let rows = "";
  if (g.away && g.home) rows += goalies("away", g.away.abbrev) + goalies("home", g.home.abbrev);
  if ((S.injuries || []).length) rows += `<tr class="sub"><th colspan="3">${TEAM_NAMES[S.team]} injuries</th></tr>` + injuryRows(S.injuries, 3);
  if ((S.opp_injuries || []).length) rows += `<tr class="sub"><th colspan="3">${TEAM_NAMES[O.abbrev] || O.abbrev} injuries</th></tr>` + injuryRows(S.opp_injuries, 3);
  return rows || `<tr><td class="tm">No lineup or injury news yet.</td></tr>`;
}

function prospectBody(list) {
  return list.map(p => `<tr>
    <td class="rank"></td>
    <td class="tm"><div>${headImg(p.headshot)}<span>${esc(p.name)} <small>${esc(p.pos || "")}</small></span></div></td>
    <td class="dim">${esc(p.league || "")} ${esc(p.team || "")}</td><td>${p.gp}</td>
    <td>${p.goalie ? `${p.w ?? "-"} W, ${p.svp != null ? Number(p.svp).toFixed(3).replace(/^0/, "") : "-"} SV%` : `${p.g}-${p.a}-<b>${p.pts}</b>`}</td></tr>`).join("");
}

function affResult(a, g) {
  if (!g) return "";
  const home = g.home.abbrev === a.code, us = home ? g.home : g.away, them = home ? g.away : g.home;
  if (g.state === "FINAL") {
    const r = us.score > them.score ? "W" : (g.lastPeriodType !== "REG" ? "OTL" : "L");
    return `${r} ${us.score}-${them.score} ${home ? "vs" : "at"} ${them.abbrev}`;
  }
  const d = new Date(g.start);
  return `${home ? "vs" : "at"} ${them.abbrev}, ${d.toLocaleDateString([], {weekday: "short", month: "numeric", day: "numeric"})} ${localTime(g.start)}`;
}

function affiliateBody(a) {
  const st = a.standings;
  const line = (label, text) => text ? `<tr class="sub info"><th></th><th colspan="6"><span>${label}</span> ${esc(text)}</th></tr>` : "";
  const rows = st.rows.map((t, i) => `<tr class="${t.abbrev === a.code ? "us" : ""}">
      <td class="rank">${i + 1}</td><td class="tm"><div>${logoImg({...t, league: a.league})}<span>${esc(t.name || t.abbrev)}</span></div></td>
      <td>${t.gp ?? ""}</td><td>${t.w ?? ""}</td><td>${t.l ?? ""}</td><td>${t.otl ?? ""}</td><td class="p">${t.pts ?? ""}</td></tr>`).join("");
  return (a.playoffs && a.series ? line("Playoffs", a.series.text) : "") + line("Last", affResult(a, a.last)) + line("Next", affResult(a, a.next))
    + `<tr class="sub"><th></th><th colspan="6">${esc(st.title)}</th></tr>` + rows
    + line("Leaders", (a.leaders || []).map(p => `${p.name} ${p.pts} pts`).join(", "));
}

function panelViews() {
  const st = S.standings || [];
  const views = [];
  const div = (name, dwell) => {
    const rows = st.filter(t => t.division === name).sort((a, b) => a.divSeq - b.divSeq);
    if (rows.length) views.push({title: `${name} division`, head: STANDINGS_HEAD, body: () => standingsRows(rows, 3), dwell, legend: LEG.standings});
  };
  // Playoff bracket first while the playoffs are on
  const P = S.playoffs;
  if (P && (P.series || []).length) views.push({title: `Stanley Cup Playoffs${P.label ? ": " + P.label.replace(/-/g, " ") : ""}`,
    head: "", body: () => bracketBody(P), dwell: 25000, cls: "bracket", legend: LEG.bracket});
  const O = S.opponent;
  if (O) views.push({title: `Tonight's opponent: ${TEAM_NAMES[O.abbrev] || O.abbrev}`, head: "",
    body: () => opponentBody(O), dwell: 25000, legend: LEG.opponent});
  if (O && (S.lineup || (S.injuries || []).length || (S.opp_injuries || []).length))
    views.push({title: "Goalies and injuries", head: "", body: () => lineupBody(O), dwell: 18000, cls: "list", legend: LEG.goalies});
  div("Metropolitan", 25000);
  const M = S.milestones || [];
  const L = S.leaders;
  if (L && L.skaters && L.skaters.length) views.push({
    title: `${TEAM_NAMES[S.team] || S.team} leaders`,
    head: `<tr><th></th><th>Player</th><th>GP</th><th>G</th><th>A</th><th>PTS</th></tr>`,
    body: () => leadersBody(L), dwell: 20000, legend: LEG.leaders});
  if ((S.injuries || []).length && !O)
    views.push({title: `${TEAM_NAMES[S.team]} injury report`, head: "", body: () => injuryRows(S.injuries, 8), dwell: 14000, cls: "list"});
  if ((S.prospects || []).length)
    views.push({title: "Prospect watch", head: `<tr><th></th><th>Player</th><th>Team</th><th>GP</th><th>Stats</th></tr>`,
      body: () => prospectBody(S.prospects), dwell: 16000, cls: "list prospects", legend: LEG.prospects});
  if ((S.transactions || []).length)
    views.push({title: "Transactions", head: `<tr><th style="width:86%"></th><th></th></tr>`, body: () => S.transactions.slice(0, 8).map(t => `<tr>
      <td class="tm" style="width:auto"><div class="clamp"><span class="tag2">${esc(t.tag)}</span>${esc(t.text)}</div></td>
      <td class="dim" style="white-space:nowrap">${t.date ? new Date(t.date + "T12:00:00").toLocaleDateString([], {month: "short", day: "numeric"}) : ""}</td></tr>`).join(""),
      dwell: 16000, cls: "list"});
  if ((S.on_this_day || []).length && !S.offseason)
    views.push({title: "On this day", head: "", body: () => S.on_this_day.map(l => `<tr><td class="tm">${esc(l)}</td></tr>`).join(""),
      dwell: 12000, cls: "list"});
  if (M.length) views.push({title: "Milestone watch", head: `<tr><th></th><th>Player</th><th>Career</th><th>To go</th></tr>`,
    body: () => M.map(m => `<tr>
      <td class="rank"></td>
      <td class="tm"><div>${headImg(m.headshot)}<span>${esc(m.name)}</span></div></td>
      <td class="val">${m.value.toLocaleString()} ${m.stat}</td>
      <td><span class="ms">${m.left}</span> <small style="font-size:2vh;color:var(--steel)">to ${m.target.toLocaleString()}</small></td>
    </tr>`).join(""), dwell: 14000, cls: "roomy", legend: LEG.milestones});
  for (const a of S.affiliates || []) {
    const st = a.standings;
    if (!st || !(st.rows || []).length) continue;
    views.push({title: `${a.code} ${a.nickname || a.name} (${a.league})`,
      head: `<tr><th></th><th>Team</th><th>GP</th><th>W</th><th>L</th><th>OT</th><th>PTS</th></tr>`,
      body: () => affiliateBody(a), dwell: 15000, cls: "aff", logo: {abbrev: a.code, logo: a.logo, league: a.league}, legend: LEG.affiliate});
  }
  const me = teamRow(S.team);
  const conf = (me && me.conference) || "Eastern";
  const wc = st.filter(t => t.conference === conf && t.wcSeq > 0).sort((a, b) => a.wcSeq - b.wcSeq);
  if (wc.length) {
    const wc2 = wc[1], firstOut = wc[2];
    const gapFn = (t, i) => i < 2 ? (firstOut ? t.pts - firstOut.pts : 0) : (wc2 ? t.pts - wc2.pts : 0);
    views.push({title: `${conf === "Eastern" ? "East" : "West"} wild card`,
      head: `<tr><th></th><th>Team</th><th>GP</th><th>W</th><th>L</th><th>OT</th><th>PTS</th><th>Gap</th></tr>`,
      body: () => standingsRows(wc.slice(0, 8), 2, gapFn), dwell: 18000, legend: LEG.wildcard});
  }
  const LL = S.league_leaders;
  if (LL && (LL.points || []).length) views.push({
    title: "League leaders", head: `<tr><th></th><th>Player</th><th style="text-align:right">Team</th><th></th></tr>`,
    body: () => leagueLeadersBody(LL), dwell: 16000, cls: "compact", legend: LEG.league});
  div("Atlantic", 12000); div("Central", 12000); div("Pacific", 12000);
  return views;
}

// Drop rows from the bottom of a panel until the rest fits (long transaction text, etc.).
function fitPanel() {
  const wrap = document.querySelector(".tablewrap"), body = $("stBody");
  let guard = 30;
  while (wrap.scrollHeight > wrap.clientHeight + 1 && body.rows.length > 1 && guard--) {
    body.deleteRow(body.rows.length - 1);
  }
}

function renderPanel() {
  const views = panelViews();
  if (!views.length) {
    $("stHead").innerHTML = ""; $("stBody").innerHTML = `<tr><td class="tm">Standings load shortly.</td></tr>`;
    clearTimeout(rotTimer); rotTimer = setTimeout(renderPanel, 5000); return;
  }
  const v = views[rotIdx % views.length];
  $("stTitle").innerHTML = (v.logo ? logoImg(v.logo).replace("<img", '<img style="width:5vh;height:5vh;margin-right:1vw;vertical-align:middle"') : "") + esc(v.title);
  $("stHead").innerHTML = v.head;
  $("stBody").innerHTML = v.body();
  $("stBody").parentElement.className = v.cls || "";
  $("panelLegend").innerHTML = legendHTML(v.legend);
  fitPanel();
  const bar = $("rotor");
  bar.style.transition = "none"; bar.style.width = "0";
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${v.dwell}ms linear`; bar.style.width = "100%"; }));
  clearTimeout(rotTimer);
  rotTimer = setTimeout(() => { rotIdx++; renderPanel(); }, v.dwell);
}

/* ---------- news ticker ---------- */
function renderTicker() {
  const news = S.news || [];
  const key = JSON.stringify(news);
  if (key === newsKey) return;
  newsKey = key;
  const el = $("ticker");
  if (!news.length) { el.style.display = "none"; return; }
  el.style.display = "flex";
  $("tickerLbl").textContent = `${TEAM_NAMES[S.team] || S.team} news`;
  const items = news.map(n => `<span class="item">${n.tag ? `<b style="color:var(--gold)">${esc(n.tag)}</b> ` : ""}${esc(n.title)}${n.source ? ` <small>${esc(n.source)}</small>` : ""}</span>`).join("");
  const track = $("track");
  track.innerHTML = items + items;   // doubled so the loop is seamless
  requestAnimationFrame(() => {
    const px = track.scrollWidth / 2;
    track.style.animationDuration = `${Math.max(30, px / 70)}s`;   // ~70 px per second
  });
}

/* ---------- bottom bar ---------- */
function formDots() {
  const f = S.form || [];
  if (!f.length) return "";
  return `<span class="formwrap">
    <span class="form">${f.map(x => `<i class="${x.r}"></i>`).join("")}</span>
    <span class="formkey"><span class="k">Last ${f.length}</span><span><i class="W"></i>Win</span><span><i class="L"></i>Loss</span><span><i class="OTL"></i>OT loss</span></span>
  </span>`;
}

function raceText(me) {
  const st = S.standings || [];
  const conf = st.filter(t => t.conference === me.conference);
  const wc = conf.filter(t => t.wcSeq > 0).sort((a, b) => a.wcSeq - b.wcSeq);
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const inSpot = me.divSeq <= 3 || (me.wcSeq > 0 && me.wcSeq <= 2);
  if (inSpot) {
    const firstOut = wc[2];
    if (!firstOut) return "";
    const cushion = me.pts - firstOut.pts;
    return `In a playoff spot, ${plural(cushion, "pt")} clear of 9th`;
  }
  const wc2 = wc[1];
  if (!wc2) return "";
  const back = wc2.pts - me.pts, gih = wc2.gp - me.gp;
  const hand = gih > 0 ? `, ${plural(gih, "game")} in hand` : gih < 0 ? `, ${-gih} more played` : "";
  return back > 0 ? `${plural(back, "pt")} out of a wild card${hand}` : `Tied for the last wild card${hand}`;
}

function countdown(iso) {
  const mins = Math.round((new Date(iso) - Date.now()) / 60000);
  if (mins <= 0) return "Puck drop soon";
  const h = Math.floor(mins / 60), m = mins % 60;
  return `Puck drop in ${h ? h + "h " : ""}${m}m`;
}

function renderBar() {
  const el = $("next");
  const g = S.game;
  const me = teamRow(S.team);

  // Game day: our team plays later today
  if (g && (g.state === "FUT" || g.state === "PRE") && isToday(g.start)) {
    const opp = g.home.abbrev === S.team ? g.away : g.home;
    const home = g.home.abbrev === S.team;
    const o = teamRow(opp.abbrev);
    const hour = new Date(g.start).getHours();
    const tv = pickTv(g);
    el.className = "next gameday";
    el.style.display = "flex";
    el.innerHTML = `<span class="lbl">${hour >= 17 ? "Tonight" : "Today"}</span>
      <span class="what">${logoImg({abbrev: S.team})}${TEAM_NAMES[S.team]} <span class="vs">${home ? "vs" : "at"}</span> ${logoImg(opp)}${TEAM_NAMES[opp.abbrev] || opp.abbrev}</span>
      <span class="when"><span>${localTime(g.start)}${tv ? " on " + tv : ""}</span><small>${countdown(g.start)}</small></span>
      ${o ? `<span class="rec"><b>${TEAM_NAMES[opp.abbrev] || opp.abbrev} ${o.w}-${o.l}-${o.otl}</b><span>${ordinal(o.divSeq)} in the ${o.division}</span></span>` : ""}`;
    return;
  }

  const up = S.upcoming || [];
  el.className = "next";
  el.style.display = (up.length || me) ? "flex" : "none";
  const chips = up.map((n, i) => {
    const home = n.home === S.team, opp = home ? n.away : n.home;
    const d = new Date(n.start);
    const when = i === 0
      ? `${d.toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"})}, ${localTime(n.start)}`
      : d.toLocaleDateString([], {weekday: "short", month: "numeric", day: "numeric"});
    return `<span class="chip ${i === 0 ? "first" : ""}">${logoImg({abbrev: opp})}<span><div class="a">${home ? "vs" : "at"} ${opp}</div><div class="d">${when}</div></span></span>`;
  }).join("");
  let rec = me ? `<span class="rec"><b>${me.w}-${me.l}-${me.otl}, ${ordinal(me.divSeq)} ${DIV_SHORT[me.division] || me.division}</b><span>${raceText(me)}</span></span>` : "";
  const ours = S.playoffs && S.playoffs.ours;
  if (ours) rec = `<span class="rec"><b>${esc(ours.text)}</b><span>Stanley Cup Playoffs, ${esc((ours.label || "").replace(/-/g, " "))}</span></span>`;
  if (!up.length && S.offseason) {
    const open = (S.offseason.events || []).find(e => e.label === "Opening night");
    el.style.display = "flex";
    el.innerHTML = `<span class="lbl">Offseason</span><span class="chips">${open ? `<span class="chip first">${logoImg({abbrev: open.opp})}<span><div class="a">Opening night: ${open.home ? "vs" : "at"} ${open.opp}</div><div class="d">${daysUntil(open.date)} days to go</div></span></span>` : ""}</span>${rec}`;
    return;
  }
  el.innerHTML = `<span class="lbl">${up.length ? "Next" : ""}</span><span class="chips">${chips}</span>${rec}${formDots()}`;
}

/* ---------- goal ---------- */
function renderGoalWho() {
  const g = S.game, info = S.goal_info;
  const us = g && (g.home.abbrev === S.team ? g.home : g.away);
  // Only show the scorer once the feed's summary has caught up to this goal.
  if (info && us && info.count === us.score) {
    const assists = info.assists.length
      ? "Assisted by " + info.assists.map(a => `${esc(a.name)}${a.num ? ` (${a.num})` : ""}`).join(", ")
      : "Unassisted";
    const tag = info.strength === "pp" ? "Power-play goal" : info.strength === "sh" ? "Shorthanded goal" : "";
    $("goalWho").innerHTML = `${info.headshot ? `<img src="${info.headshot}" alt="" onerror="this.remove()">` : ""}
      <div><div class="name">${esc(info.name)}${info.num ? ` (${info.num})` : ""}</div>
      <div class="assists">${assists}</div>${tag ? `<span class="tag">${tag}</span>` : ""}</div>`;
  } else {
    $("goalWho").innerHTML = logoImg({abbrev: S.team});
  }
}

// Only the wall display (opened as localhost) plays sound by default, so a copy of the
// board open on another computer stays quiet. Add ?sound=on or ?sound=off to override.
const SOUND = (new URLSearchParams(location.search).get("sound")
  || (["localhost", "127.0.0.1", "::1"].includes(location.hostname) ? "on" : "off")) === "on";

// Browsers block sound until someone clicks the page, unless the kiosk flag
// --autoplay-policy=no-user-gesture-required is set. Show a hint when that happens.
function soundBlocked() {
  const el = $("soundHint");
  if (el) el.style.display = "block";
}
function unlockSound() {
  const el = $("soundHint");
  if (el) el.style.display = "none";
  try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); ctx.resume().then(() => ctx.close()); } catch (e) {}
}
["click", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, unlockSound));

function playHorn(volume, file) {
  const c = S.config || {};
  if (!SOUND || (volume == null && !c.horn)) return;
  const vol = Math.max(0, Math.min(1, volume ?? c.horn_volume ?? 0.6));
  file = file || (c.horn_file ? "/static/horn.mp3" : null);
  if (file) {                      // your own horn file
    // Restart rather than overlap if another goal comes while it's still playing.
    if (hornAudio) { hornAudio.pause(); clearInterval(hornAudio._fade); }
    const a = hornAudio = new Audio(file + "?v=" + (S.build || ""));
    a.volume = vol;
    a.play().catch(err => { if (err && err.name === "NotAllowedError") soundBlocked(); });
    const max = c.horn_max_seconds || 0;
    if (max > 0) {                 // fade out over the last 3 seconds
      setTimeout(() => {
        a._fade = setInterval(() => {
          a.volume = Math.max(0, a.volume - vol / 30);
          if (a.volume <= 0) { a.pause(); clearInterval(a._fade); }
        }, 100);
      }, Math.max(0, max - 3) * 1000);
    }
    return;
  }
  // Built-in synthesized horn: three blasts of a low chord.
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") soundBlocked();
    const master = ctx.createGain(); master.gain.value = vol; master.connect(ctx.destination);
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1100; lp.connect(master);
    const t0 = ctx.currentTime + 0.05;
    [[0, 1.2], [1.5, 1.2], [3.0, 2.6]].forEach(([start, dur]) => {
      [174.6, 220.0, 261.6, 87.3].forEach(f => {
        const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = f;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, t0 + start);
        g.gain.linearRampToValueAtTime(0.18, t0 + start + 0.08);
        g.gain.setValueAtTime(0.18, t0 + start + dur - 0.2);
        g.gain.linearRampToValueAtTime(0, t0 + start + dur);
        o.connect(g); g.connect(lp);
        o.start(t0 + start); o.stop(t0 + start + dur + 0.05);
      });
    });
    setTimeout(() => ctx.close(), 7000);
  } catch (e) { /* no audio available */ }
}

function goal() {
  playHorn();
  const el = $("goal");
  goalUntil = Date.now() + 15000;
  renderGoalWho();
  el.classList.remove("on"); void el.offsetWidth; el.classList.add("on");
  setTimeout(() => { if (Date.now() >= goalUntil) el.classList.remove("on"); }, 15000);
}

/* ---------- affiliates: goal banner, live badge, takeover ---------- */
function affiliateGoal() {
  const ev = S.aff_goal, c = S.config || {};
  if (!ev) return;
  // The team's own horn plays only when it's the only one of our teams playing.
  const pensPlaying = S.mode === "live";
  const othersPlaying = liveAffiliates().some(a => a.code !== ev.team);
  if (c.affiliate_horn && !pensPlaying && !othersPlaying) {
    const files = c.horn_files || [];
    const name = [String(ev.team).toLowerCase(), String(ev.league).toLowerCase()].find(n => files.includes(n));
    playHorn(c.affiliate_horn_volume ?? c.horn_volume ?? 0.6, name ? `/static/horn-${name}.mp3` : null);
  }
  const el = $("affGoal");
  el.innerHTML = `${esc(ev.team)} goal!<small>${ev.league ? esc(ev.league) + "  " : ""}${esc(ev.team)} ${ev.us ?? ""}, ${esc(ev.opp || "")} ${ev.them ?? ""}</small>`;
  el.classList.remove("on"); void el.offsetWidth; el.classList.add("on");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 8000);
}

function liveAffiliates() {
  return (S.affiliates || []).filter(a => a.live);
}

function renderAffBadge(skipCode) {
  const list = liveAffiliates().filter(a => a.code !== skipCode);
  const el = $("affBadge");
  el.classList.toggle("on", list.length > 0);
  el.innerHTML = list.map(a => {
    const g = a.live;
    const st = g.intermission ? `${ordinal(g.period)} int.` : `${periodLabel(g)} ${g.clock || ""}`;
    const side = k => `${logoImg(g[k])}<span class="${g[k].abbrev === a.code ? "us" : ""}">${g[k].abbrev} ${g[k].score ?? 0}</span>`;
    return `<div class="abadge"><span class="lg">${a.league}</span>${side("away")}${side("home")}<span class="st">${st}</span></div>`;
  }).join("");
}

/* ---------- night mode ---------- */
function isNight() {
  const c = S.config || {};
  if (!c.night) return false;
  const h = new Date().getHours(), a = c.night_start, b = c.night_end;
  return a < b ? (h >= a && h < b) : (h >= a || h < b);
}

function renderNight() {
  const up = (S.upcoming || [])[0];
  if (up) {
    const home = up.home === S.team, opp = home ? up.away : up.home;
    const d = new Date(up.start);
    $("nNext").innerHTML = `${logoImg({abbrev: opp})}Next: ${home ? "vs" : "at"} ${TEAM_NAMES[opp] || opp}, ${d.toLocaleDateString([], {weekday: "short"})} ${localTime(up.start)}`;
  } else $("nNext").innerHTML = "";
  $("nOtd").textContent = (S.on_this_day || [])[0] ? "On this day: " + S.on_this_day[0] : "";
}

// Drift the night clock a little every few minutes so nothing sits in one spot all night.
setInterval(() => {
  const x = Math.round((Math.random() - .5) * 30), y = Math.round((Math.random() - .5) * 30);
  $("nightBox").style.transform = `translate(${x}vw, ${y}vh)`;
}, 5 * 60 * 1000);

/* ---------- loop ---------- */
let leagueShown = false;
function render() {
  const g = S.game;
  const gameView = ["live", "pregame", "final"].includes(S.mode) && g;
  const summary = gameView && (S.mode === "final" || (S.mode === "live" && g.intermission));
  const cfg = S.config || {};
  const affLive = liveAffiliates()[0];
  const affFinal = affLive ? null : (S.affiliates || []).find(a => a.recent_final);
  const takeover = !gameView && cfg.affiliate_takeover ? (affLive || affFinal || null) : null;
  const affGame = takeover ? (takeover.live || takeover.recent_final) : null;
  const affSummary = !!(affGame && (affGame.state === "FINAL" || affGame.intermission));
  const night = !gameView && !takeover && isNight();
  $("board").classList.toggle("on", !!((gameView && !summary) || (takeover && !affSummary)));
  $("summary").classList.toggle("on", !!summary || affSummary);
  $("league").classList.toggle("on", !gameView && !takeover && !night);
  $("night").classList.toggle("on", night);
  if (summary) { renderSummary(g, S.mode); leagueShown = false; }
  else if (gameView) { renderBoard(g, S.mode); leagueShown = false; }
  else if (takeover && affSummary) {
    renderSummary(affGame, affGame.state === "FINAL" ? "final" : "live", {us: takeover.code, tag: takeover.league,
      details: {periods: affGame.periods || [], shots: affGame.shots || [], stats: [], stars: [],
                goals: affGame.goals || [], lineups: affGame.lineups}});
    leagueShown = false;
  }
  else if (takeover) {
    renderBoard(takeover.live, "live", {us: takeover.code, details: {goals: takeover.live.goals || [], penalties: []},
      tag: `<b>${takeover.league}${takeover.playoffs ? " PLAYOFFS" : ""}</b>${esc(takeover.name)}${takeover.series ? `: ${esc(takeover.series.text)}` : ""}`});
    leagueShown = false;
  }
  else if (night) { renderNight(); leagueShown = false; }
  else {
    renderScores(); renderBar(); renderTicker();
    if (!leagueShown) { leagueShown = true; renderPanel(); }
  }
  if (Date.now() < goalUntil) renderGoalWho();   // fill in the scorer when the feed catches up
  if (!(gameView || takeover)) $("boardTag").innerHTML = "";
  if (gameView || takeover) renderAffBadge(takeover && takeover.code);
  else $("affBadge").classList.remove("on");
  $("affBadge").classList.toggle("alt", !!summary || affSummary);

  // Warn if the data has stopped updating.
  const age = S.updated ? (Date.now() - new Date(S.updated)) / 60000 : 0;
  const err = $("err");
  if (age > 10) {
    const ago = age < 120 ? `${Math.round(age)} minutes` : `${Math.round(age / 60)} hours`;
    err.textContent = `Last updated ${ago} ago. The wallboard server may need a restart.`;
    err.className = "stale";
  } else {
    err.textContent = S.error || ""; err.className = "";
  }
}

async function poll() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    S = await r.json();
    // Reload when the server restarts or the page file is updated.
    if (S.build && build && S.build !== build) { location.reload(); return; }
    build = S.build;
    if (lastGoal !== null && S.goal_seq > lastGoal) goal();
    lastGoal = S.goal_seq;
    if (lastAffGoal !== null && S.aff_goal_seq > lastAffGoal) affiliateGoal();
    lastAffGoal = S.aff_goal_seq;
    render();
  } catch (e) {
    $("err").textContent = "Lost contact with the wallboard server. Retrying.";
  }
}
tick(); setInterval(tick, 1000);
poll(); setInterval(poll, 4000);
setInterval(() => location.reload(), 6 * 60 * 60 * 1000);  // fresh page every 6 hours
</script>
